<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>सभा नोंद | मोर्डे ग्राम विकास मंडळ</title>

<link rel="stylesheet" href="style.css">

<style>
.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 11px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

.form-group textarea {
    min-height: 90px;
    resize: vertical;
}

.btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.btn-row button {
    padding: 11px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}
</style>

</head>

<body>

<header class="top-header">


    <div class="title-box">

    <h1>📅 सभा नोंद</h1>
        
        <p>
            मोर्डे ग्राम विकास मंडळ, मुंबई
        </p>

    </div>
    
</header>
<a href="index.html"
       class="btn btn-secondary">

        <i class="fa fa-home"></i>
      मुख्यपृष्ठ
</a>
    
<div class="container">

<div class="card">

<h2>नवीन सभा नोंद</h2>

<form id="meetingForm">

<div class="form-group">
    <label>📅 सभेची तारीख</label>
    <input type="date" id="date" required>
</div>

<div class="form-group">
    <label>📍 सभेचे ठिकाण</label>
    <input
        type="text"
        id="place"
        placeholder="सभेचे ठिकाण"
        required>
</div>

<div class="form-group">
    <label>🪑 सभेचे अध्यक्ष</label>
    <input
        type="text"
        id="chairman"
        placeholder="अध्यक्षाचे नाव"
        required>
</div>

<div class="form-group">
    <label>📝 सभेचा विषय / अजेंडा</label>
    <textarea
        id="subject"
        placeholder="सभेचा विषय / अजेंडा"></textarea>
</div>

<div class="form-group">
    <label>👥 एकूण उपस्थित संख्या</label>
    <input
        type="number"
        id="count"
        min="0"
        placeholder="उदा. 25">
</div>

<div class="form-group">
    <label>💰 सभेचा जमा</label>
    <input
        type="text"
        id="collection"
        placeholder="सभेचा जमा">
</div>

<div class="form-group">
    <label>💸 सभेचा खर्च</label>
    <input
        type="text"
        id="expense"
        placeholder="सभेचा खर्च">
</div>

<div class="form-group">
    <label>📌 सभेचे निर्णय / ठराव</label>
    <textarea
        id="decision"
        placeholder="सभेचे निर्णय / ठराव"></textarea>
</div>

<div class="btn-row">

<button type="submit">
💾 सभा सेव्ह करा
</button>

<button
    type="button"
    onclick="location.href='meetings.html'">
📋 सभा नोंदी पहा
</button>

<button
    type="button"
    onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

</form>

</div>

</div>

<script>

document
.getElementById("meetingForm")
.addEventListener("submit", saveMeeting);


function saveMeeting() {

    const meeting = {

        id: Date.now(),

        date:
            document.getElementById("date").value,

        place:
            document.getElementById("place").value.trim(),

        chairman:
            document.getElementById("chairman").value.trim(),

        subject:
            document.getElementById("subject").value.trim(),

        count:
            document.getElementById("count").value,

        collection:
            document.getElementById("collection").value.trim(),

        expense:
            document.getElementById("expense").value.trim(),

        decision:
            document.getElementById("decision").value.trim(),

        createdAt:
            new Date().toISOString()

    };


    if (!meeting.date || !meeting.chairman) {

        alert("कृपया सभेची तारीख आणि अध्यक्षाचे नाव भरा.");

        return;
    }


    let meetings =
        JSON.parse(
            localStorage.getItem("meetings")
        ) || [];


    meetings.push(meeting);


    localStorage.setItem(
        "meetings",
        JSON.stringify(meetings)
    );


    alert("सभा नोंद यशस्वीपणे सेव्ह झाली.");


    location.href = "meetings.html";

}

</script>
</body>
</html>

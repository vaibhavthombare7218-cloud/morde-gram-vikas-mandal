<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>बाकी वर्गणी</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header>
<h1>📋 बाकी वर्गणी Report</h1>
</header>


<div class="container">

<div class="card">


<label>🔍 सभासद शोधा</label><br>

<input type="text"
id="search"
placeholder="नाव टाइप करा..."
onkeyup="loadPending()"
style="width:100%;padding:10px;">

<br><br>


<table border="1" width="100%" cellspacing="0" cellpadding="8">

<thead>

<tr>
<th>सभासद नाव</th>
<th>2026 पर्यंत बाकी</th>
<th>स्थिती</th>
</tr>

</thead>


<tbody id="pendingTable">

</tbody>


</table>


<br>


<button onclick="location.href='index.html'">
🏠 Dashboard
</button>


</div>

</div>



<script>


let pending =
JSON.parse(localStorage.getItem("pending")) || [];



function loadPending(){


let search =
document.getElementById("search").value.toLowerCase();


let html="";


pending.forEach(function(item){


if(item.member.toLowerCase().includes(search)){


let status =
Number(item.amount)>0
? "🔴 बाकी"
: "🟢 पूर्ण";



html += `

<tr>

<td>${item.member}</td>

<td>
₹${item.amount}
</td>

<td>
${status}
</td>


</tr>

`;

}

});



document.getElementById("pendingTable").innerHTML=html;


}



loadPending();


</script>


</body>

</html>

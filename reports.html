<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>रिपोर्ट</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>📊 जमा / खर्च रिपोर्ट</h1>
</header>

<div class="container">

<div class="card">

<input
type="text"
id="search"
placeholder="Member ID / नाव / वाडी / तारीख"
onkeyup="loadReport()">

<br><br>

<h3>एकूण जमा : <span id="income">₹0</span></h3>
<h3>एकूण खर्च : <span id="expense">₹0</span></h3>
<h3>शिल्लक : <span id="balance">₹0</span></h3>

</div>

<div class="card">

<table border="1" width="100%" cellspacing="0" cellpadding="8">

<thead>

<tr>

<th>तारीख</th>
<th>प्रकार</th>
<th>सभासद</th>
<th>तपशील</th>
<th>रक्कम</th>
<th>पावती</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

<br>

<button onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

</div>

<script>

let list = JSON.parse(localStorage.getItem("transactions")) || [];

let members = JSON.parse(localStorage.getItem("members")) || [];

let income = 0;

let expense = 0;

function loadReport(){

let search = document.getElementById("search").value.toLowerCase();

let html = "";

income = 0;

expense = 0;

list.forEach(function(item,index){

let member = members.find(function(m){

return m.memberId === item.memberId;

});

let memberName = member ? member.name : (item.member || "");

let memberWadi = member ? member.wadi : (item.wadi || "");

if(
(memberName.toLowerCase().includes(search)) ||
((item.memberId||"").toLowerCase().includes(search)) ||
(memberWadi.toLowerCase().includes(search)) ||
((item.date||"").toLowerCase().includes(search))
){

if(item.type=="income"){
income += Number(item.amount);
}else{
expense += Number(item.amount);
}

html += `
<tr>

<td>${item.date}</td>

<td>
${item.type=="income" ? "➕ जमा" : "➖ खर्च"}
</td>

<td>

${memberName}

<br>

<small>${item.memberId||""}</small>

</td>

<td>

${item.details}

<br>

<small>${memberWadi}</small>

</td>

<td>

₹${item.amount}

</td>

<td>

${
item.category=="subscription"

?

`<button onclick='printReceipt(${JSON.stringify(item)})'>
🧾 पावती
</button>`

:

"-"

}

</td>

<td>

<button onclick="deleteRecord(${index})">

🗑️

</button>

</td>

</tr>

`;

}

});

document.getElementById("reportTable").innerHTML = html;

document.getElementById("income").innerHTML =
"₹" + income.toLocaleString("en-IN");

document.getElementById("expense").innerHTML =
"₹" + expense.toLocaleString("en-IN");

document.getElementById("balance").innerHTML =
"₹" + (income - expense).toLocaleString("en-IN");

}

// Receipt

function printReceipt(data){

localStorage.setItem(
"printReceipt",
JSON.stringify(data)
);

location.href = "receipt.html";

}

// Delete Record

function deleteRecord(index){

if(confirm("ही नोंद Delete करायची आहे का?")){

list.splice(index,1);

localStorage.setItem(
"transactions",
JSON.stringify(list)
);

loadReport();

}

}

// प्रथम रिपोर्ट लोड करा

loadReport();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बाकी वर्गणी Import</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

<header>
<h1>📥 बाकी वर्गणी Import</h1>
</header>

<div class="container">

<div class="card">

<h3>Excel File निवडा</h3>

<input type="file"
id="file"
accept=".xlsx,.xls">

<br><br>

<button onclick="importData()">
📥 Import करा
</button>

<br><br>

<button onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

</div>

<script>

function importData(){

let file=document.getElementById("file").files[0];

if(!file){

alert("कृपया Excel File निवडा.");

return;

}

let reader=new FileReader();

reader.onload=function(e){

let data=new Uint8Array(e.target.result);

let workbook=XLSX.read(data,{type:"array"});

let sheet=workbook.Sheets[workbook.SheetNames[0]];

let rows=XLSX.utils.sheet_to_json(sheet);

let pending=JSON.parse(localStorage.getItem("pending"))||[];

rows.forEach(function(row){

let member=row["सभासद नाव"]||"";

let wadi=row["वाडी"]||"";

let memberId=row["सभासद क्र"]||"";

let amount=Number(
row["२०२६ ची बाकी"] ||
row["२०२६ पर्यंत बाकी"] ||
0
);

if(member!=""){

let exist=pending.find(p=>p.member==member);

if(exist){

exist.amount=amount;
exist.wadi=wadi;
exist.memberId=memberId;

}else{

pending.push({

member:member,

wadi:wadi,

memberId:memberId,

year:"2026",

amount:amount

});

}

}

});

localStorage.setItem(
"pending",
JSON.stringify(pending)
);

alert("✅ बाकी वर्गणी यशस्वीरित्या Import झाली.");

location.href="pending.html";

};

reader.readAsArrayBuffer(file);

}

</script>

</body>
</html>
``

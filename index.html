<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मोर्डे ग्राम विकास मंडळ, मुंबई</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0b6b3a;
    color:#fff;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    margin:auto;
    padding:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
}

.card{
    background:#fff;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    text-align:center;
    padding:15px;
}

.card h3{
    margin:0;
    font-size:16px;
}

.card h2{
    color:#0b6b3a;
    margin-top:10px;
}

.quick{
    margin-top:20px;
}

.quick button,
.menu button{

    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0b6b3a;
    color:#fff;
    font-size:15px;
    cursor:pointer;

}

.quick button:hover,
.menu button:hover{

background:#09552f;

}

h2.section{
margin-top:30px;
text-align:center;
color:#0b6b3a;
}

footer{
margin-top:30px;
background:#222;
color:#fff;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>🛕 मोर्डे ग्राम विकास मंडळ, मुंबई</h1>

<p>जमा - खर्च व्यवस्थापन प्रणाली</p>

</header>

<div class="container">

<div class="grid">

<div class="card">
<h3>👥 एकूण सभासद</h3>
<h2 id="members">0</h2>
</div>

<div class="card">
<h3>🏘️ एकूण वाड्या</h3>
<h2 id="wadiCount">0</h2>
</div>

<div class="card">
<h3>💰 एकूण जमा</h3>
<h2 id="income">₹0</h2>
</div>

<div class="card">
<h3>💸 एकूण खर्च</h3>
<h2 id="expense">₹0</h2>
</div>

<div class="card">
<h3>📌 शिल्लक</h3>
<h2 id="balance">₹0</h2>
</div>

<div class="card">
<h3>🔴 बाकी वर्गणी</h3>
<h2 id="pending">₹0</h2>
</div>

<div class="card">
<h3>✅ पूर्ण वर्गणी</h3>
<h2 id="paidMembers">0</h2>
</div>

<div class="card">
<h3>❌ बाकी सभासद</h3>
<h2 id="pendingMembers">0</h2>
</div>

<div class="card">
<h3>🎁 एकूण देणगी</h3>
<h2 id="donation">₹0</h2>
</div>

</div>

<h2 class="section">⚡ Quick Actions</h2>

<div class="grid quick">

<button onclick="location.href='subscription.html'">💳 वर्गणी</button>

<button onclick="location.href='income.html'">➕ जमा</button>

<button onclick="location.href='expense.html'">➖ खर्च</button>

<button onclick="location.href='memberlist.html'">👥 सभासद</button>

</div>

<h2 class="section">📂 सर्व मेनू</h2>

<div class="grid menu">

<button onclick="location.href='member_profile.html'">👤 सभासद Profile</button>

<button onclick="location.href='donation.html'">🎁 देणगी</button>

<button onclick="location.href='pending.html'">📋 बाकी वर्गणी</button>

<button onclick="location.href='wadi_report.html'">🏘️ वाडीनुसार बाकी</button>

<button onclick="location.href='reports.html'">📊 रिपोर्ट</button>

<button onclick="location.href='meeting.html'">📅 मीटिंग</button>

<button onclick="location.href='meeting_report.html'">📋 Meeting Report</button>

<button onclick="location.href='backup.html'">💾 Backup</button>

<button onclick="location.href='member_import.html'">📥 सभासद Import</button>

<button onclick="location.href='pending_import.html'">📥 बाकी Import</button>

<button onclick="location.href='clear.html'">🗑️ Clear Data</button>

</div>
<footer>
© 2026 Morde Gram Vikas Mandal Mumbai
</footer>

<script>

// Local Storage Data
const members = JSON.parse(localStorage.getItem("members")) || [];
const transactions = JSON.parse(localStorage.getItem("transactions")) || [];
const pending = JSON.parse(localStorage.getItem("pending")) || [];

// Dashboard Summary
let income = 0;
let expense = 0;
let donation = 0;
let totalPending = 0;
let paidMembers = 0;
let pendingMembers = 0;

// Members
document.getElementById("members").innerHTML = members.length;

// Income / Expense / Donation
transactions.forEach(function(t){

    let amount = Number(t.amount) || 0;

    if(t.type === "income"){
        income += amount;
    }else{
        expense += amount;
    }

    if(t.category === "donation"){
        donation += amount;
    }

});

// Pending
pending.forEach(function(p){

    let amount = Number(p.amount) || 0;

    totalPending += amount;

    if(amount > 0){
        pendingMembers++;
    }else{
        paidMembers++;
    }

});

// Wadi Count
let wadiList = [];

members.forEach(function(m){

    if(m.wadi && !wadiList.includes(m.wadi)){
        wadiList.push(m.wadi);
    }

});

// Display
document.getElementById("wadiCount").innerHTML = wadiList.length;

document.getElementById("income").innerHTML =
"₹" + income.toLocaleString("en-IN");

document.getElementById("expense").innerHTML =
"₹" + expense.toLocaleString("en-IN");

document.getElementById("balance").innerHTML =
"₹" + (income-expense).toLocaleString("en-IN");

document.getElementById("pending").innerHTML =
"₹" + totalPending.toLocaleString("en-IN");

document.getElementById("donation").innerHTML =
"₹" + donation.toLocaleString("en-IN");

document.getElementById("paidMembers").innerHTML =
paidMembers;

document.getElementById("pendingMembers").innerHTML =
pendingMembers;

  // ==========================
// Premium Dashboard Features
// ==========================

// चालू वर्ष
const currentYear = new Date().getFullYear();

// वार्षिक वर्गणी (Settings नसेल तर Default ₹200)
const annualFee = Number(localStorage.getItem("annualFee")) || 200;

// Collection %
const expectedAmount = members.length * annualFee;
const collectedAmount = transactions
    .filter(t => t.category === "subscription")
    .reduce((sum, t) => sum + Number(t.amount || 0), 0);

const collectionPercent = expectedAmount > 0
    ? ((collectedAmount / expectedAmount) * 100).toFixed(1)
    : 0;

// आजची जमा / खर्च
const today = new Date().toISOString().split("T")[0];

let todayIncome = 0;
let todayExpense = 0;

transactions.forEach(t => {

    if (t.date === today) {

        if (t.type === "income") {
            todayIncome += Number(t.amount);
        } else {
            todayExpense += Number(t.amount);
        }

    }

});

// Dashboard मध्ये नवीन माहिती
const premium = document.createElement("div");

premium.className = "grid";

premium.innerHTML = `

<div class="card">
<h3>📅 चालू वर्ष</h3>
<h2>${currentYear}</h2>
</div>

<div class="card">
<h3>💳 वार्षिक वर्गणी</h3>
<h2>₹${annualFee}</h2>
</div>

<div class="card">
<h3>📈 Collection</h3>
<h2>${collectionPercent}%</h2>
</div>

<div class="card">
<h3>💵 आजची जमा</h3>
<h2>₹${todayIncome}</h2>
</div>

<div class="card">
<h3>💸 आजचा खर्च</h3>
<h2>₹${todayExpense}</h2>
</div>

`;

document.querySelector(".container").appendChild(premium);
</script>

</body>
</html>

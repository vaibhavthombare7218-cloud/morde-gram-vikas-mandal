<!DOCTYPE html><html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🛕 मोर्डे ग्राम विकास मंडळ, मुंबई</h1><p>जमा - खर्च व्यवस्थापन प्रणाली</p></header><div class="container"><div class="grid"><div class="card"><h3>👥 एकूण सभासद</h3><h2 id="members">0</h2></div><div class="card"><h3>🏘️ एकूण वाड्या</h3><h2 id="wadiCount">0</h2></div><div class="card"><h3>💰 एकूण जमा</h3><h2 id="income">₹0</h2></div><div class="card"><h3>💸 एकूण खर्च</h3><h2 id="expense">₹0</h2></div><div class="card"><h3>📌 शिल्लक</h3><h2 id="balance">₹0</h2></div><div class="card"><h3>🔴 बाकी वर्गणी</h3><h2 id="pending">₹0</h2></div><div class="card"><h3>✅ पूर्ण वर्गणी</h3><h2 id="paidMembers">0</h2></div><div class="card"><h3>❌ बाकी सभासद</h3><h2 id="pendingMembers">0</h2></div><div class="card"><h3>🎁 एकूण देणगी</h3><h2 id="donation">₹0</h2></div></div></div><script>
const members=JSON.parse(localStorage.getItem("members"))||[];
const transactions=JSON.parse(localStorage.getItem("transactions"))||[];
const pending=JSON.parse(localStorage.getItem("pending"))||[];
document.getElementById("members").textContent=members.length;
let income=0,expense=0,donation=0;
transactions.forEach(t=>{let a=Number(t.amount)||0;if(t.type==="income")income+=a;else expense+=a;if(t.category==="donation")donation+=a;});
document.getElementById("income").textContent="₹"+income;
document.getElementById("expense").textContent="₹"+expense;
document.getElementById("balance").textContent="₹"+(income-expense);
document.getElementById("donation").textContent="₹"+donation;
let tp=0,paid=0,pcnt=0;pending.forEach(p=>{let a=Number(p.amount)||0;tp+=a;if(a>0)pcnt++;else paid++;});
document.getElementById("pending").textContent="₹"+tp;
document.getElementById("paidMembers").textContent=paid;
document.getElementById("pendingMembers").textContent=pcnt;
let s=new Set();members.forEach(m=>{if(m.wadi)s.add(m.wadi)});document.getElementById("wadiCount").textContent=s.size;

<script>  
  
  
// Members Count  
  
let members =  
JSON.parse(localStorage.getItem("members")) || [];  
  
  
document.getElementById("members")  
.innerHTML = members.length;  
  
  
  
  
// Income Expense  
  
let transactions =  
JSON.parse(localStorage.getItem("transactions")) || [];  
  
  
let income=0;  
let expense=0;  
  
  
  
transactions.forEach(function(t){  
  
  
if(t.type=="income"){  
  
income += Number(t.amount);  
  
}else{  
  
expense += Number(t.amount);  
  
}  
  
  
});  
  
  
  
document.getElementById("income")  
.innerHTML="₹"+income;  
  
  
document.getElementById("expense")  
.innerHTML="₹"+expense;  
  
  
document.getElementById("balance")  
.innerHTML="₹"+(income-expense);  
  
  
  
  
  
// Pending  
  
let pending =  
JSON.parse(localStorage.getItem("pending")) || [];  
  
  
let totalPending=0;  
  
  
pending.forEach(function(p){  
  
totalPending += Number(p.amount);  
  
});  
  
  
document.getElementById("pending")  
.innerHTML="₹"+totalPending;  
  
</script></body></html>

<script>

// एकूण वाड्या
let wadiSet = new Set();

members.forEach(function(m){
    if(m.wadi){
        wadiSet.add(m.wadi);
    }
});

document.getElementById("wadiCount").innerHTML = wadiSet.size;


// पूर्ण / बाकी सभासद
let paid = 0;
let pendingMember = 0;

pending.forEach(function(p){

    if(Number(p.amount) > 0){
        pendingMember++;
    }else{
        paid++;
    }

});

document.getElementById("paidMembers").innerHTML = paid;
document.getElementById("pendingMembers").innerHTML = pendingMember;


// एकूण देणगी
let donation = 0;

transactions.forEach(function(t){

    if(t.category=="donation"){
        donation += Number(t.amount);
    }

});

document.getElementById("donation").innerHTML = "₹" + donation;
// Members Count

let members =
JSON.parse(localStorage.getItem("members")) || [];


document.getElementById("members")
.innerHTML = members.length;




// Income Expense

let transactions =
JSON.parse(localStorage.getItem("transactions")) || [];


let income=0;
let expense=0;



transactions.forEach(function(t){


if(t.type=="income"){

income += Number(t.amount);

}else{

expense += Number(t.amount);

}


});



document.getElementById("income")
.innerHTML="₹"+income;


document.getElementById("expense")
.innerHTML="₹"+expense;


document.getElementById("balance")
.innerHTML="₹"+(income-expense);





// Pending

let pending =
JSON.parse(localStorage.getItem("pending")) || [];


let totalPending=0;


pending.forEach(function(p){

totalPending += Number(p.amount);

});


document.getElementById("pending")
.innerHTML="₹"+totalPending;



</script>

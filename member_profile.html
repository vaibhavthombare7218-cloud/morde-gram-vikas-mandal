<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>सभासद Profile</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>👤 सभासद Profile</h1></header>
<div class="container"><div class="card">
<input id="search" placeholder="ID / नाव / वाडी" onkeyup="filterMembers()"><br><br>
<select id="member" onchange="loadProfile()"></select><br><br>
<div id="profile"></div>
<br><button onclick="location.href='index.html'">🏠 Dashboard</button>
</div></div>
<script>
let members=JSON.parse(localStorage.getItem("members"))||[];
let transactions=JSON.parse(localStorage.getItem("transactions"))||[];
let pending=JSON.parse(localStorage.getItem("pending"))||[];
function fill(list){
member.innerHTML="";
list.forEach(m=>member.innerHTML+=`<option value="${m.name}">${m.name} (${m.wadi||""})</option>`);
if(list.length)loadProfile();
}
function filterMembers(){
let s=search.value.toLowerCase();
fill(members.filter(m=>(m.name||"").toLowerCase().includes(s)||(m.memberId||"").toLowerCase().includes(s)||(m.wadi||"").toLowerCase().includes(s)));
}
function loadProfile(){
let name=member.value.split(" (")[0];
let m=members.find(x=>x.name===name);
if(!m)return;
let total=0,sub="<h3>💳 वर्गणी इतिहास</h3>",don="<h3>🎁 देणगी इतिहास</h3>";
transactions.forEach(t=>{
 if(t.member===name&&t.category==="subscription"){total+=Number(t.amount);sub+=`<p>${t.year} - ₹${t.amount} (${t.payment||""})</p>`;}
 if(t.member===name&&t.category==="donation"){don+=`<p>${t.date} - ₹${t.amount}</p>`;}
});
let p=pending.find(x=>x.member===name);
profile.innerHTML=`
<p><b>Member ID:</b> ${m.memberId||""}</p>
<p><b>नाव:</b> ${m.name}</p>
<p><b>वाडी:</b> ${m.wadi||""}</p>
<p><b>मोबाईल:</b> ${m.mobile||""}</p>
<hr>${sub}<hr>${don}
<hr><h3>एकूण भरलेली वर्गणी : ₹${total}</h3>
<h3>बाकी रक्कम : ₹${p?p.amount:0}</h3>`;
}
fill(members);
</script></body></html>

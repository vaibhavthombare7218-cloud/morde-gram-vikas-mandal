<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>देणगी नोंद</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header>
<h1>🎁 देणगी नोंद</h1>
</header>


<div class="container">


<div class="card">


<label>देणगीदार नाव</label><br>

<input type="text" id="name"
placeholder="नाव"
style="width:100%;padding:10px;">

<br><br>


<label>मोबाईल नंबर</label><br>

<input type="text" id="mobile"
placeholder="मोबाईल नंबर"
style="width:100%;padding:10px;">

<br><br>


<label>रक्कम</label><br>

<input type="number" id="amount"
placeholder="₹"
style="width:100%;padding:10px;">

<br><br>


<label>पावती क्रमांक</label><br>

<input type="text" id="receipt"
placeholder="उदा. 1001"
style="width:100%;padding:10px;">

<br><br>


<label>Payment Mode</label><br>

<select id="payment"
style="width:100%;padding:10px;">

<option value="Cash">Cash</option>
<option value="UPI">UPI</option>
<option value="Bank">Bank</option>

</select>


<br><br>


<button onclick="saveDonation()">
💾 Save
</button>


<button onclick="location.href='index.html'">
🏠 Dashboard
</button>


</div>


<br>


<div class="card">


<h2>📋 देणगी List</h2>


<input type="text"
id="search"
placeholder="देणगीदार शोधा..."
onkeyup="loadDonation()"
style="width:100%;padding:10px;">


<br><br>


<h3>
एकूण देणगी :
<span id="total">₹0</span>
</h3>



<table border="1" width="100%" cellspacing="0" cellpadding="8">


<thead>

<tr>

<th>तारीख</th>
<th>नाव</th>
<th>रक्कम</th>
<th>Payment</th>

</tr>

</thead>


<tbody id="donationList">

</tbody>


</table>


</div>


</div>



<script>



function saveDonation(){


let name =
document.getElementById("name").value;


let mobile =
document.getElementById("mobile").value;


let amount =
document.getElementById("amount").value;


let receipt =
document.getElementById("receipt").value;


let payment =
document.getElementById("payment").value;



if(name=="" || amount==""){

alert("नाव आणि रक्कम भरा.");

return;

}



let list =
JSON.parse(localStorage.getItem("transactions")) || [];



list.push({

type:"income",

category:"donation",

member:name,

mobile:mobile,

amount:Number(amount),

receipt:receipt,

payment:payment,

date:new Date()
.toISOString()
.split("T")[0],

details:"देणगी"


});



localStorage.setItem(
"transactions",
JSON.stringify(list)
);



alert("देणगी सेव्ह झाली.");


loadDonation();



// Clear

document.getElementById("name").value="";
document.getElementById("mobile").value="";
document.getElementById("amount").value="";
document.getElementById("receipt").value="";


}





function loadDonation(){


let list =
JSON.parse(localStorage.getItem("transactions")) || [];


let search =
document.getElementById("search").value.toLowerCase();



let html="";

let total=0;



list.forEach(function(item){


if(item.category=="donation"){


if(item.member.toLowerCase()
.includes(search)){



total += Number(item.amount);



html += `

<tr>

<td>${item.date}</td>

<td>${item.member}</td>

<td>₹${item.amount}</td>

<td>${item.payment}</td>


</tr>

`;


}


}


});



document.getElementById("donationList")
.innerHTML=html;


document.getElementById("total")
.innerHTML="₹"+total;


}



loadDonation();



</script>


</body>

</html>

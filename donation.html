<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>देणगी नोंद</title>

<link rel="stylesheet" href="style.css">
</head>


<body>

<header>
<h1>🎁 देणगी नोंद</h1>
</header>


<div class="container">

<div class="card">


<label>देणगीदार नाव</label><br>
<input type="text" id="name"
placeholder="नाव"
style="width:100%;padding:10px;">
<br><br>


<label>मोबाईल नंबर</label><br>
<input type="text" id="mobile"
placeholder="मोबाईल नंबर"
style="width:100%;padding:10px;">
<br><br>


<label>रक्कम</label><br>
<input type="number" id="amount"
placeholder="₹"
style="width:100%;padding:10px;">
<br><br>


<label>पावती क्रमांक</label><br>
<input type="text" id="receipt"
placeholder="उदा. 1001"
style="width:100%;padding:10px;">
<br><br>


<label>Payment Mode</label><br>

<select id="payment"
style="width:100%;padding:10px;">

<option value="Cash">Cash</option>
<option value="UPI">UPI</option>
<option value="Bank">Bank</option>

</select>

<br><br>


<button onclick="saveDonation()">
💾 Save
</button>


<button onclick="location.href='index.html'">
🏠 Dashboard
</button>


</div>

</div>



<script>


function saveDonation(){


let name =
document.getElementById("name").value;


let mobile =
document.getElementById("mobile").value;


let amount =
document.getElementById("amount").value;


let receipt =
document.getElementById("receipt").value;


let payment =
document.getElementById("payment").value;



if(name=="" || amount==""){

alert("नाव आणि रक्कम भरा.");

return;

}



let list =
JSON.parse(localStorage.getItem("transactions")) || [];



list.push({

type:"income",

category:"donation",

member:name,

mobile:mobile,

amount:amount,

receipt:receipt,

payment:payment,

date:new Date().toISOString().split("T")[0],

details:"देणगी"


});



localStorage.setItem(
"transactions",
JSON.stringify(list)
);



alert("देणगी यशस्वीरित्या सेव्ह झाली.");


location.href="reports.html";


}


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>देणगी व्यवस्थापन | मोर्डे ग्राम विकास मंडळ</title>

    <link rel="stylesheet"
          href="style.css">

    <style>
        .report-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            padding: 18px 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .report-header h1 {
            margin: 0;
            font-size: 23px;
            font-weight: 800;
        }

        .report-header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.95;
        }
        
        .donation-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
        }

        .donation-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.10);
            margin-bottom: 20px;
        }

        .donation-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .donation-title h2 {
            margin: 0;
        }

        .donation-title p {
            margin-top: 6px;
            color: #666;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .member-search-box {
            position: relative;
        }

        .member-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ddd;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
        }

        .member-result {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .member-result:hover {
            background: #f3f3f3;
        }

        .btn {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin: 5px 0;
        }

        .btn-save {
            background: #198754;
            color: #fff;
            width: 100%;
        }

        .btn-history {
            background: #0d6efd;
            color: #fff;
            width: 100%;
        }

        .btn-back {
            background: #6c757d;
            color: #fff;
        }

        .btn-delete {
            background: #dc3545;
            color: #fff;
            padding: 7px 10px;
            font-size: 13px;
        }

        .history-section {
            display: none;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .history-search {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        .total-donation {
            background: #f1f8e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 17px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 9px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #f5f5f5;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        .success-message {
            display: none;
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .optional-text {
            font-size: 12px;
            color: #777;
            font-weight: normal;
        }

        @media (max-width: 600px) {

            .donation-container {
                padding: 10px;
            }

            .donation-card {
                padding: 15px;
            }

        }

    </style>
</head>


<body>

<div class="donation-container">


    <!-- ================= DONATION FORM ================= -->

    <div id="donationFormSection"
         class="donation-card">

        <div class="donation-title">

            <h2>देणगी नोंदणी</h2>

            <p>
                मोर्डे ग्राम विकास मंडळ, मुंबई
            </p>

        </div>


        <div id="successMessage"
             class="success-message">

            देणगीची नोंद यशस्वीरीत्या सेव्ह झाली.

        </div>


        <!-- देणगीदार नाव -->

        <div class="form-group">

            <label>
                देणगीदार नाव *
            </label>

            <input
                type="text"
                id="donorName"
                placeholder="देणगीदाराचे नाव">

        </div>


        <!-- Member Search -->

        <div class="form-group">

            <label>
                सभासद शोधा
                <span class="optional-text">
                    (सभासद नसल्यास रिकामे ठेवा)
                </span>
            </label>

            <div class="member-search-box">

                <input
                    type="text"
                    id="memberSearch"
                    placeholder="Member ID / नाव / मोबाईल टाका"
                    autocomplete="off">

                <div
                    id="memberResults"
                    class="member-results">
                </div>

            </div>

        </div>


        <!-- Member ID -->

        <div class="form-group">

            <label>
                मेंबर 🆔
                <span class="optional-text">
                    (Optional)
                </span>
            </label>

            <input
                type="text"
                id="memberId"
                placeholder="सभासद असल्यास MGVM-0001">

        </div>


        <!-- Mobile -->

        <div class="form-group">

            <label>
                मोबाईल
                <span class="optional-text">
                    (Optional)
                </span>
            </label>

            <input
                type="text"
                id="mobile"
                placeholder="मोबाईल नंबर"
                maxlength="10">

        </div>


        <!-- Date -->

        <div class="form-group">

            <label>
                तारीख *
            </label>

            <input
                type="date"
                id="donationDate">

        </div>


        <!-- Amount -->

        <div class="form-group">

            <label>
                रक्कम *
            </label>

            <input
                type="number"
                id="amount"
                placeholder="देणगीची रक्कम"
                min="1"
                step="1">

        </div>


        <!-- Receipt -->

        <div class="form-group">

            <label>
                पावती क्र.
                <span class="optional-text">
                    (Optional)
                </span>
            </label>

            <input
                type="text"
                id="receiptNo"
                placeholder="पावती क्रमांक">

        </div>


        <!-- Payment Mode -->

        <div class="form-group">

            <label>
                Payment Mode *
            </label>

            <select id="paymentMode">

                <option value="">
                    Payment Mode निवडा
                </option>

                <option value="Cash">
                    Cash
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Bank Transfer">
                    Bank Transfer
                </option>

                <option value="Cheque">
                    Cheque
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- Save -->

        <button
            class="btn btn-save"
            onclick="saveDonation()">

            💾 देणगी सेव्ह करा

        </button>


        <!-- History -->

        <button
            class="btn btn-history"
            onclick="showDonationHistory()">

            📋 मागील सर्व देणगीदार पहा

        </button>

    </div>



    <!-- ================= HISTORY ================= -->

    <div id="historySection"
         class="donation-card history-section">


        <div class="history-header">

            <h2>
                मागील सर्व देणगीदार
            </h2>

            <button
                class="btn btn-back"
                onclick="showDonationForm()">

                ← परत जा

            </button>

        </div>


        <input
            type="text"
            id="historySearch"
            class="history-search"
            placeholder="नाव / Member ID / मोबाईल / पावती क्र. शोधा..."
            oninput="displayDonationHistory()">


        <div
            id="totalDonation"
            class="total-donation">

            एकूण देणगी: ₹0

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>क्र.</th>

                        <th>देणगीदार नाव</th>

                        <th>मेंबर ID</th>

                        <th>मोबाईल</th>

                        <th>तारीख</th>

                        <th>रक्कम</th>

                        <th>पावती क्र.</th>

                        <th>Payment Mode</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="donationHistoryBody">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="donation.js"></script>
<script src="header.js"></script>
</body>

</html>

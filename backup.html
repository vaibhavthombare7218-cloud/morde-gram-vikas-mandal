<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backup</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>💾 Backup / Restore</h1>

</header>



<div class="container">


<div class="card">


<h3>📤 Backup घ्या</h3>


<button onclick="backupData()">
💾 Download Backup
</button>


<br><br>


<hr>


<h3>📥 Restore करा</h3>


<input type="file" id="restoreFile"
accept=".json">


<br><br>


<button onclick="restoreData()">
📥 Restore Data
</button>



<br><br>


<button onclick="location.href='index.html'">
🏠 Dashboard
</button>


</div>


</div>




<script>


function backupData(){



let backup = {


members:
JSON.parse(localStorage.getItem("members")) || [],


transactions:
JSON.parse(localStorage.getItem("transactions")) || [],


pending:
JSON.parse(localStorage.getItem("pending")) || [],


meetings:
JSON.parse(localStorage.getItem("meetings")) || []

};



let data =
JSON.stringify(backup);



let blob =
new Blob([data],
{type:"application/json"});



let url =
URL.createObjectURL(blob);



let a =
document.createElement("a");


a.href=url;


a.download =
"GramVikas_Backup.json";


a.click();



alert("Backup तयार झाला.");



}





function restoreData(){


let file =
document.getElementById("restoreFile")
.files[0];



if(!file){

alert("Backup File निवडा.");

return;

}



let reader =
new FileReader();



reader.onload=function(e){


let data =
JSON.parse(e.target.result);



localStorage.setItem(
"members",
JSON.stringify(data.members || [])
);



localStorage.setItem(
"transactions",
JSON.stringify(data.transactions || [])
);



localStorage.setItem(
"pending",
JSON.stringify(data.pending || [])
);



localStorage.setItem(
"meetings",
JSON.stringify(data.meetings || [])
);



alert("Data Restore झाला.");

location.href="index.html";


};



reader.readAsText(file);



}



</script>


</body>

</html>

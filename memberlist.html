<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>सभासद यादी</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>👥 सभासद यादी</h1></header>
<div class="container">
<div class="card">
<h3>एकूण सभासद: <span id="count">0</span></h3>
<input id="search" placeholder="ID / नाव / वाडी शोधा..." onkeyup="loadMembers()" style="width:100%;padding:10px"><br><br>
<table border="1" width="100%" cellspacing="0" cellpadding="8">
<thead><tr><th>ID</th><th>नाव</th><th>वाडी</th><th>मोबाईल</th><th>Delete</th></tr></thead>
<tbody id="memberTable"></tbody></table><br>
<button onclick="location.href='members.html'">➕ नवीन सभासद</button>
<button onclick="location.href='index.html'">🏠 Dashboard</button>
</div></div>
<script>
let members=JSON.parse(localStorage.getItem("members"))||[];
function loadMembers(){
 let s=document.getElementById("search").value.toLowerCase();
 let html="",count=0;
 members.forEach((m,i)=>{
  let id=m.memberId||"";
  let name=m.name||"";
  let wadi=m.wadi||"";
  let mobile=m.mobile||"";
  if(id.toLowerCase().includes(s)||name.toLowerCase().includes(s)||wadi.toLowerCase().includes(s)){
    count++;
    html+=`<tr><td>${id}</td><td>${name}</td><td>${wadi}</td><td>${mobile}</td><td><button onclick="deleteMember(${i})">🗑️</button></td></tr>`;
  }
 });
 document.getElementById("memberTable").innerHTML=html;
 document.getElementById("count").textContent=members.length;
}
function deleteMember(i){
 if(confirm("हा सभासद Delete करायचा आहे का?")){
   members.splice(i,1);
   localStorage.setItem("members",JSON.stringify(members));
   loadMembers();
 }
}
loadMembers();
</script></body></html>

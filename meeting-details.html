<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>सभा तपशील | मोर्डे ग्राम विकास मंडळ</title>

<link rel="stylesheet" href="style.css">

<style>

.detail-row {

    border-bottom: 1px solid #eee;

    padding: 14px 5px;

    line-height: 1.6;
}


.detail-label {

    font-weight: bold;

    display: block;

    margin-bottom: 4px;
}


.detail-value {

    white-space: pre-wrap;

    word-break: break-word;

}


.button-row {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 20px;
}


.button-row button {

    padding: 11px 18px;

    border: none;

    border-radius: 6px;

    cursor: pointer;

    font-size: 15px;
}


.not-found {

    text-align: center;

    padding: 30px;

    color: #777;
}

</style>

</head>


<body>

<header>

<h1>📅 सभा तपशील</h1>

</header>


<div class="container">

<div class="card">

<div id="meetingDetails"></div>


<div class="button-row">

<button onclick="location.href='meetings.html'">
📋 सभा नोंदी
</button>

<button onclick="location.href='meeting.html'">
➕ नवीन सभा
</button>

<button onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

</div>

</div>


<script>


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}



function formatDate(dateString) {

    if (!dateString)
        return "-";

    const parts =
        dateString.split("-");

    if (parts.length !== 3)
        return dateString;

    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );
}



function getMeeting() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    if (!id)
        return null;


    const meetings =
        JSON.parse(
            localStorage.getItem("meetings")
        ) || [];


    return meetings.find(
        function(meeting) {

            return String(meeting.id) === String(id);

        }
    );

}



function showMeeting() {

    const meeting =
        getMeeting();


    const container =
        document.getElementById(
            "meetingDetails"
        );


    if (!meeting) {

        container.innerHTML = `

            <div class="not-found">

                <h2>❌ सभा नोंद सापडली नाही</h2>

                <p>
                    निवडलेली सभा नोंद उपलब्ध नाही.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <h2>सभेची संपूर्ण माहिती</h2>


        <div class="detail-row">

            <span class="detail-label">
                📅 सभेची तारीख
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    formatDate(meeting.date)
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                📍 सभेचे ठिकाण
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    meeting.place || "-"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                🪑 सभेचे अध्यक्ष
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    meeting.chairman || "-"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                📝 सभेचा विषय / अजेंडा
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    meeting.subject || "-"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                👥 एकूण उपस्थित संख्या
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    meeting.count || "0"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                💰 सभेचा जमा
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    meeting.collection || "-"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                💸 सभेचा खर्च
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    meeting.expense || "-"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                📌 सभेचे निर्णय / ठराव
            </span>

            <span class="detail-value">
                ${escapeHTML(
                    meeting.decision || "-"
                )}
            </span>

        </div>

    `;

}


showMeeting();

</script>

</body>

</html>

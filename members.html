<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सभासद व्यवस्थापन</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>👥 सभासद व्यवस्थापन</h1>
</header>

<div class="container">

<div class="card">

<input type="hidden" id="editIndex">

<label>Member ID</label>
<input type="text" id="memberId" readonly>

<label>सभासदाचे नाव</label>
<input type="text" id="name">

<label>वाडी</label>
<input type="text" id="wadi">

<label>मोबाईल</label>
<input type="text" id="mobile">

<label>पत्ता</label>
<textarea id="address"></textarea>

<br><br>

<button onclick="saveMember()">💾 Save</button>
<button onclick="clearForm()">🆕 New</button>

</div>

<div class="card">

<input
type="text"
id="search"
placeholder="Member ID / नाव / वाडी"
onkeyup="loadMembers()">

<br><br>

<table border="1" width="100%" cellpadding="8">

<thead>

<tr>

<th>ID</th>
<th>नाव</th>
<th>वाडी</th>
<th>मोबाईल</th>
<th>✏️</th>
<th>🗑️</th>

</tr>

</thead>

<tbody id="memberTable">

</tbody>

</table>

<br>

<button onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

</div>

<script>

let members = JSON.parse(localStorage.getItem("members")) || [];

function nextId(){

let max=0;

members.forEach(function(m){

if(m.memberId){

let num=parseInt(
m.memberId.replace("MGVM-","")
);

if(num>max){

max=num;

}

}

});

return "MGVM-"+String(max+1).padStart(4,"0");

}

function loadMembers(){

let s=document.getElementById("search").value.toLowerCase();

let html="";

members.forEach(function(m,index){

if(

(m.memberId||"").toLowerCase().includes(s) ||

(m.name||"").toLowerCase().includes(s) ||

(m.wadi||"").toLowerCase().includes(s)

){

html+=`

<tr>

<td>${m.memberId}</td>

<td>${m.name}</td>

<td>${m.wadi||""}</td>

<td>${m.mobile||""}</td>

<td>

<button onclick="editMember(${index})">

✏️

</button>

</td>

<td>

<button onclick="deleteMember(${index})">

🗑️

</button>

</td>

</tr>

`;

}

});

document.getElementById("memberTable").innerHTML=html;

}

function saveMember(){

let edit=document.getElementById("editIndex").value;

let id=document.getElementById("memberId").value || nextId();

let name=document.getElementById("name").value.trim();

let wadi=document.getElementById("wadi").value.trim();

let mobile=document.getElementById("mobile").value.trim();

let address=document.getElementById("address").value.trim();

if(name==""){

alert("सभासदाचे नाव भरा.");

return;

}

let duplicate=members.findIndex(function(m,i){

return m.name.trim().toLowerCase()==name.toLowerCase()

&& i!==Number(edit);

});

if(duplicate!=-1){

alert("❌ हा सभासद आधीच नोंदवलेला आहे.");

return;

}

let obj={

memberId:id,

name:name,

wadi:wadi,

mobile:mobile,

address:address

};

if(edit==""){

members.push(obj);

alert("✅ नवीन सभासद सेव्ह झाला.");

}else{

members[Number(edit)]=obj;

alert("✅ सभासद माहिती अपडेट झाली.");

}

localStorage.setItem("members",JSON.stringify(members));

clearForm();

loadMembers();

}

function editMember(index){

let m=members[index];

document.getElementById("editIndex").value=index;

document.getElementById("memberId").value=m.memberId;

document.getElementById("name").value=m.name;

document.getElementById("wadi").value=m.wadi||"";

document.getElementById("mobile").value=m.mobile||"";

document.getElementById("address").value=m.address||"";

}

function deleteMember(index){

if(confirm("हा सभासद Delete करायचा आहे का?")){

members.splice(index,1);

localStorage.setItem("members",JSON.stringify(members));

loadMembers();

clearForm();

}

}

function clearForm(){

document.getElementById("editIndex").value="";

document.getElementById("memberId").value=nextId();

document.getElementById("name").value="";

document.getElementById("wadi").value="";

document.getElementById("mobile").value="";

document.getElementById("address").value="";

}

clearForm();

loadMembers();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="mr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>सभासद व्यवस्थापन | मोर्डे ग्राम विकास मंडळ</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="top-header">

<div class="logo-box">
<img src="assets/logo.png" alt="MGVM Logo">
</div>

<div class="title-box">
<h1>सभासद व्यवस्थापन</h1>
<p>मोर्डे ग्राम विकास मंडळ, मुंबई</p>
</div>

</header>

<nav class="main-nav">

<button onclick="location.href='index.html'">
<i class="fa fa-home"></i><br>
मुख्यपृष्ठ
</button>

<button onclick="location.href='members.html'">
<i class="fa fa-users"></i><br>
सभासद
</button>

<button onclick="location.href='subscription.html'">
<i class="fa fa-money-bill-wave"></i><br>
वर्गणी
</button>

<button onclick="location.href='reports.html'">
<i class="fa fa-chart-column"></i><br>
अहवाल
</button>

</nav>

<main class="container">

<h2 class="section-title">
👥 नवीन सभासद नोंदणी
</h2>

<div class="form-card">

<form id="memberForm">

<div class="form-row">

<div>

<label>सभासद आयडी</label>

<input
type="text"
id="memberId"
readonly>

</div>

<div>

<label>सभासद नाव</label>

<input
type="text"
id="memberName"
placeholder="पूर्ण नाव लिहा"
required>

</div>

</div>

<div class="form-row">

<div>

<label>मोबाईल नंबर</label>

<input
type="tel"
id="mobile"
maxlength="10"
placeholder="9876543210">

</div>

<div>

<label>वाडी</label>

<select id="wadi">

<option value="">वाडी निवडा</option>

<option>लाडवाडी _१</option>

<option>लाडवाडी_२</option>

<option>वरची ढवळवाडी</option>

<option>ढवळवाडी</option>

<option>खालची ठोंबरेवाडी</option>

<option>रांबाडेवाडी</option>

<option>बोडण वाडी</option>

<option>पाठारवाडी</option>

<option>गोवुळवाडी</option>
     
<option>वरची ठोंबरेवाडी</option>
    
<option>घाटकरवाडी</option>
    
<option>दळवीवाडी</option> 
     
<option>सत्याचीवाडी</option>

<option>नाडणकर वाडी</option>
     
<option>बौद्धवाडी</option>
     
<option>गवळीवाडी</option>
     
</select>

</div>

</div>

<div class="form-row">

<div>

<label>जन्मतारीख</label>

<input
type="date"
id="dob">

</div>

<div>

<label>सभासद फोटो</label>

<input
type="file"
id="photo"
accept="image/*">

</div>

</div>

<div class="form-row">

<div style="grid-column:1/-1;">

<label>पत्ता</label>

<textarea
id="address"
placeholder="पूर्ण पत्ता लिहा"></textarea>

</div>

</div>

<div class="flex gap-10">

<button
type="submit"
class="btn btn-success">

<i class="fa fa-save"></i>

सभासद जतन करा

</button>

<button
type="reset"
class="btn btn-danger">

रीसेट

</button>

</div>

</form>

</div>

<hr class="mt-30">

<h2 class="section-title">

🔍 सभासद शोधा

</h2>

<input
type="text"
id="searchMember"
placeholder="नाव किंवा मोबाईल नंबर टाका...">

<br><br>

<select id="wadiFilter">

<option value="">सर्व वाड्या</option>

<option>मोर्डेवाडी</option>

<option>देऊळवाडी</option>

<option>भंडारवाडी</option>

<option>सोनारवाडी</option>

<option>गावठाण</option>

<option>वरची वाडी</option>

<option>खालची वाडी</option>

<option>पाटीलवाडी</option>

</select>

<br><br>
<!-- ===========================
     Action Buttons
============================ -->

<div class="flex gap-10 mb-20">

<button class="btn btn-primary" id="importBtn">
<i class="fa-solid fa-file-import"></i>
Excel Import
</button>

<button class="btn btn-success" id="exportBtn">
<i class="fa-solid fa-file-export"></i>
Excel Export
</button>

<button class="btn btn-warning" id="printBtn">
<i class="fa-solid fa-print"></i>
Print List
</button>

</div>

<input
type="file"
id="excelFile"
accept=".xlsx,.xls,.csv"
style="display:none;">

<!-- ===========================
     Member List
============================ -->

<h2 class="section-title">
📋 सभासद यादी
</h2>

<div class="table-responsive">

<table class="table" id="memberTable">

<thead>

<tr>

<th>फोटो</th>

<th>Member ID</th>

<th>नाव</th>

<th>वाडी</th>

<th>मोबाईल</th>

<th>बाकी वर्गणी</th>

<th>Action</th>

</tr>

</thead>

<tbody id="memberTableBody">

<tr>

<td colspan="7" align="center">

अद्याप कोणताही सभासद उपलब्ध नाही.

</td>

</tr>

</tbody>

</table>

</div>

<!-- ===========================
     Photo Preview Modal
============================ -->

<div id="photoModal" class="modal">

<div class="modal-content">

<span class="close">&times;</span>

<img
id="previewImage"
style="width:100%;border-radius:10px;">

</div>

</div>

<!-- ===========================
     Toast
============================ -->

<div id="toast" class="toast">

सभासद यशस्वीरित्या जतन झाला.

</div>

<!-- ===========================
     Loading
============================ -->

<div class="loader" id="loader">

<div class="spinner"></div>

</div>

<!-- ===========================
     Footer
============================ -->

<footer>

<p>

© 2026 मोर्डे ग्राम विकास मंडळ, मुंबई

</p>

<p>

Digital Member Management System

</p>

</footer>

<!-- SheetJS Library -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- Database -->

<script src="database.js"></script>

<!-- Members Script -->

<script src="members.js"></script>

</main>

</body>

</html>

<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>जमा नोंद</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>➕ जमा नोंद</h1>
</header>

<div class="container">

<div class="card">

<label><b>तारीख</b></label><br><br>
<input type="date" id="date" style="width:100%;padding:12px;"><br><br>

<label><b>तपशील</b></label><br><br>
<input type="text" id="details"
placeholder="उदा. वर्गणी / देणगी"
style="width:100%;padding:12px;"><br><br>

<label><b>रक्कम</b></label><br><br>
<input type="number" id="amount"
placeholder="₹"
style="width:100%;padding:12px;"><br><br>

    if(
    document.getElementById("date").value=="" ||
    document.getElementById("details").value=="" ||
    document.getElementById("amount").value==""
){
    alert("कृपया सर्व माहिती भरा.");
    return;
}
<button onclick="saveIncome()">💾 Save</button>

<br><br>

<button onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

</div>

<script>

function saveIncome(){

let list=JSON.parse(localStorage.getItem("transactions"))||[];

list.push({

type:"income",

date:document.getElementById("date").value,

details:document.getElementById("details").value,

amount:document.getElementById("amount").value

});

localStorage.setItem("transactions",JSON.stringify(list));

alert("जमा यशस्वीरीत्या सेव्ह झाली.");

location.href="index.html";

}

</script>

</body>
</html>

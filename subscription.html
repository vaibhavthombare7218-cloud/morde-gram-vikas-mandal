<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>वर्गणी</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>💳 वर्गणी नोंद</h1></header>

<div class="container">
<div class="card">

<label>🔍 शोधा</label>
<input id="search" onkeyup="filterMembers()" placeholder="ID / नाव / वाडी">

<label>सभासद</label>
<select id="member" onchange="memberChanged()"></select>

<label>Member ID</label>
<input id="memberId" readonly>

<label>वाडी</label>
<input id="wadi" readonly>

<label>बाकी रक्कम</label>
<input id="pending" readonly value="₹0">

<label>वर्ष</label>
<input id="year" type="number" value="2026">

<label>भरलेली रक्कम</label>
<input id="amount" type="number">

<label>पावती क्रमांक</label>
<input id="receipt">

<label>Payment</label>
<select id="payment">
<option>Cash</option>
<option>UPI</option>
<option>Bank</option>
</select>

<br><br>
<button onclick="saveSubscription()">💾 Save</button>
<button onclick="location.href='index.html'">🏠 Dashboard</button>

</div>
</div>

<script>
let members=JSON.parse(localStorage.getItem("members"))||[];
let pending=JSON.parse(localStorage.getItem("pending"))||[];
let tx=JSON.parse(localStorage.getItem("transactions"))||[];

function load(list){
member.innerHTML += `<option value="${m.memberId}">${m.name} (${m.memberId})</option>`;
});
memberChanged();
}

function filterMembers(){
let s=search.value.toLowerCase();
load(members.filter(m=>
(m.name||"").toLowerCase().includes(s)||
(m.memberId||"").toLowerCase().includes(s)||
(m.wadi||"").toLowerCase().includes(s)
));
}

function memberChanged(){

let id = member.value;

let m = members.find(x => x.memberId === id);

if(!m) return;

memberId.value = m.memberId;
wadi.value = m.wadi || "";

let p = pending.find(x => x.memberId === id);

document.getElementById("pending").value = "₹" + (p ? p.amount : 0);

 }

function saveSubscription(){
let id = member.value;

let m = members.find(x => x.memberId === id);

if(!m){
    alert("सभासद निवडा");
    return;
}

let name = m.name;
let year=document.getElementById("year").value;
let amt=Number(amount.value);
if(!amt){alert("रक्कम भरा");return;}
if(tx.find(t =>
    t.category === "subscription" &&
    t.memberId === id &&
    t.year == year
)){
alert("या वर्षाची वर्गणी आधीच भरली आहे.");return;
}
let p = pending.find(x => x.memberId === id);
if(p){
 if(amt>p.amount){alert("रक्कम बाकीपेक्षा जास्त आहे.");return;}
 p.amount-=amt;
 localStorage.setItem("pending",JSON.stringify(pending));
}
tx.push({
type:"income",category:"subscription",
memberId:id,member:name,wadi:wadi.value,
year:year,amount:amt,receipt:receipt.value,payment:payment.value,
date:new Date().toISOString().split("T")[0],
details:"वार्षिक वर्गणी"
});
localStorage.setItem("transactions",JSON.stringify(tx));
alert("वर्गणी सेव्ह झाली.");
location.href="reports.html";
}
load(members);
</script>
</body>
</html>
